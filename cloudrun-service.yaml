apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: waha-production
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/memory: "2Gi"
        run.googleapis.com/cpu: "1000m"
        run.googleapis.com/max-scale: "10"
        run.googleapis.com/min-scale: "1"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      containers:
      - name: waha
        image: gcr.io/YOUR_PROJECT/waha:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: WAHA_AUTH_ENABLED
          value: "true"
        - name: WAHA_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: waha-secrets
              key: jwt-secret
        - name: WAHA_API_KEY
          valueFrom:
            secretKeyRef:
              name: waha-secrets
              key: api-key
        - name: WAHA_DEFAULT_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waha-secrets
              key: admin-password
        - name: WAHA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: waha-secrets
              key: database-url
        resources:
          limits:
            cpu: "1000m"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/server/version
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/server/version
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: waha-data
          mountPath: /app/data
      volumes:
      - name: waha-data
        persistentVolumeClaim:
          claimName: waha-data-pvc
